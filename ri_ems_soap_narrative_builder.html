<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOAP Narrative Builder</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16233B; --ink:#2A3341; --muted:#6B7482; --line:#D9DEE6;
  --paper:#F7F8FA; --white:#FFFFFF; --red:#C8102E; --green:#1F7A4D; --field:#EEF1F5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.45}
header{background:var(--navy);color:#fff;padding:18px 20px 14px}
header h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.01em}
header p{margin:4px 0 0;font-size:13px;opacity:.75}
main{max-width:860px;margin:0 auto;padding:12px 14px 120px}
section.block{background:var(--white);border:1px solid var(--line);border-radius:10px;margin:14px 0;display:grid;grid-template-columns:54px 1fr}
section.block .tag{background:var(--navy);color:#fff;border-radius:9px 0 0 9px;display:flex;align-items:flex-start;justify-content:center;padding-top:14px;font-size:30px;font-weight:700;line-height:1}
section.block .tag.pre{background:var(--red)}
section.block .body{padding:14px 16px 16px;min-width:0}
section.block h2{margin:0 0 10px;font-size:16px;font-weight:600}
fieldset{border:0;padding:0;margin:0 0 12px}
legend{font-weight:600;font-size:13.5px;margin-bottom:6px;padding:0}
.row{display:flex;flex-wrap:wrap;gap:10px}
.row>*{flex:1 1 150px;min-width:0}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:7px;padding:9px 10px;min-height:42px}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus{outline:2px solid var(--navy);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips label{display:inline-flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13.5px;cursor:pointer;user-select:none}
.chips label:has(input:checked){background:var(--navy);color:#fff;border-color:var(--navy)}
.chips input{position:absolute;opacity:0;width:0;height:0}
.tri label{position:relative;padding-left:12px}
.tri label[data-state="admits"]{background:var(--green);color:#fff;border-color:var(--green)}
.tri label[data-state="denies"]{background:var(--red);color:#fff;border-color:var(--red)}
.tri label[data-state="admits"]::before{content:"\2713\00a0"}
.tri label[data-state="denies"]::before{content:"\2715\00a0"}
.other{margin-top:8px;display:none}
.other.show{display:block}
.hint{font-size:12.5px;color:var(--muted);margin:4px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;max-width:100%;justify-content:center}
.bar button{font:inherit;font-weight:600;border-radius:8px;padding:12px 18px;border:1px solid var(--line);background:var(--white);color:var(--ink);cursor:pointer;flex:1 1 0;max-width:280px}
.bar button.primary{background:var(--red);color:#fff;border-color:var(--red)}
#out{background:var(--white);border:1px solid var(--line);border-radius:10px;padding:16px;margin-top:14px;display:none}
#out h2{margin:0 0 8px;font-size:16px}
#narr{white-space:pre-wrap;font-size:14.5px;line-height:1.55;min-height:60px}
#flags{background:#FFF7E0;border:1px solid #E8C97A;border-radius:10px;padding:14px 16px;margin-top:14px;display:none}
#flags h2{margin:0 0 6px;font-size:16px}
#flags ul{margin:0;padding-left:20px}
#flags li{margin:3px 0}
#flags.ok{background:#E8F5EC;border-color:#9CD1AE}
.rows .r{display:grid;grid-template-columns:1.6fr 1fr .8fr 1fr .8fr auto;gap:6px;margin-bottom:6px;align-items:center}
.rows.acc .r{grid-template-columns:.8fr .8fr 1.4fr .7fr .9fr .8fr auto}
.rows .r input,.rows .r select{min-height:38px;padding:6px 8px;font-size:14px}
.rows .r button{border:1px solid var(--line);background:var(--white);border-radius:7px;min-height:38px;width:38px;cursor:pointer;font-size:18px;line-height:1}
.add{font:inherit;font-size:13.5px;font-weight:500;background:var(--field);border:1px solid var(--line);border-radius:7px;padding:8px 12px;cursor:pointer;color:var(--navy)}
@media (max-width:600px){.rows .r,.rows.acc .r{grid-template-columns:1fr 1fr 1fr;grid-auto-rows:auto}}
#toast{position:fixed;bottom:72px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:8px 14px;border-radius:999px;font-size:13px;display:none}
@media (max-width:520px){section.block{grid-template-columns:44px 1fr}section.block .tag{font-size:24px}}
@media (prefers-reduced-motion:no-preference){.chips label{transition:background .12s}}
</style>
</head>
<body>
<header>
  <h1>SOAP Narrative Builder</h1>
  <p>Rhode Island EMS protocols. Check what applies, fill the blanks, generate.</p>
</header>
<main id="app"></main>

<div id="flags"><h2>Missing or worth checking</h2><ul id="flaglist"></ul></div>
<div id="out"><h2>Narrative</h2><div id="narr"></div></div>
<div id="toast">Copied</div>
<div class="bar">
  <button id="clear">Clear all</button>
  <button id="gen" class="primary">Generate narrative</button>
  <button id="copy">Copy</button>
</div>

<script>
// ---------- form definition ----------
const D = {

  pmh: ["hypertension","diabetes","CAD","prior MI","CHF","COPD","asthma","CVA/TIA","seizure disorder","afib","CKD/dialysis","cancer","dementia","psychiatric history","substance use","anxiety/depression","hyperlipidemia","GERD","DVT/PE","no significant PMH"],
  meds: ["compliant with medications","non compliant with medications","takes anticoagulants","takes antiplatelets","takes insulin","takes oral hypoglycemics","takes beta blockers","takes opioids","takes no medications","medication list obtained","medication list unavailable"],
  src: ["patient","family","bystanders","facility staff","police","caregiver","medical alert service"],
  gen: ["no acute distress","mild distress","moderate distress","severe distress","tripoding","diaphoretic","pale","flushed","cyanotic","anxious","calm and cooperative","agitated","lethargic","unresponsive","obese","well appearing","ill appearing","disheveled"],
  loc: ["A&Ox4","A&Ox3","A&Ox2","A&Ox1","A&Ox0","confused","GCS 15","responds to verbal","responds to pain","unresponsive","postictal","intoxicated appearing"],
  air: ["patent","self maintained","obstructed","stridor","snoring respirations","gurgling","secretions present","maintained with OPA","maintained with NPA","maintained with iGel","intubated"],
  breath: ["unlabored","labored","tachypneic","bradypneic","shallow","rapid and deep","accessory muscle use","speaking in full sentences","speaking in short sentences","1 to 2 word dyspnea","agonal","apneic"],
  lung: ["clear bilaterally","diminished bilaterally","diminished left","diminished right","wheezes bilaterally","wheezes expiratory","rales bilaterally","rales bibasilar","rhonchi","absent left","absent right","stridor"],
  skin: ["warm, dry, normal color","cool","cold","hot","dry","diaphoretic","moist","pale","flushed","cyanotic","jaundiced","mottled","normal cap refill","delayed cap refill"],

  ext: ["moves all extremities","CSM intact x4","CSM intact in affected extremity","CSM absent distal to injury","pedal edema","no edema","deformity","swelling","bruising","tenderness","open wound","weakness left side","weakness right side","equal grip strength","unequal grip strength","pronator drift present","no pronator drift","calf tenderness"],
  neuro: ["no focal deficits","speech clear","slurred speech","aphasia","facial droop","arm drift","gait unsteady","gait normal","normal sensation","decreased sensation","seizure activity witnessed","BE-FAST negative","BE-FAST positive"],
  ecg: ["not obtained","sinus rhythm","sinus tachycardia","sinus bradycardia","atrial fibrillation","atrial flutter","SVT","1st degree AVB","2nd degree AVB","3rd degree AVB","PVCs","paced rhythm","ventricular tachycardia","ventricular fibrillation","asystole","PEA","no ST changes","ST elevation","ST depression","STEMI criteria met","STEMI criteria not met","LBBB","RBBB","artifact limits interpretation"],
  impress: ["Chest pain, suspected cardiac","Chest pain, non cardiac","STEMI","Acute coronary syndrome","Respiratory distress","COPD exacerbation","Asthma exacerbation","CHF exacerbation","Pneumonia","Stroke/TIA","Seizure","Syncope","Altered mental status","Hypoglycemia","Hyperglycemia","Opioid overdose","Alcohol intoxication","Anaphylaxis","Allergic reaction","Abdominal pain","GI bleed","Dehydration","Sepsis","Cardiac arrest","Dysrhythmia","Behavioral emergency","Trauma, minor","Trauma, multisystem","Head injury","Extremity fracture/dislocation","Fall with injury","Fall without injury","Back pain","Generalized weakness","No acute findings","Other"],
  proto: ["Routine Patient Care","Chest Pain / Acute Coronary Syndrome","STEMI","Respiratory Distress","Bronchospasm","CHF / Pulmonary Edema","Stroke","Seizures","Altered Mental Status","Hypoglycemia / Hyperglycemia","Cardiac Arrest","Bradycardia","Tachycardia","Anaphylaxis / Allergic Reaction","Overdose / Poisoning","Pain Management","Nausea / Vomiting","Trauma / Spinal Motion Restriction","Traumatic Brain Injury","Hemorrhage Control","Burns","Behavioral Emergencies","Sepsis","Refusal of Care","Other"],

  toc: ["RN","MD","PA","charge nurse","triage nurse","ED staff","ALS crew","BLS crew"],
  refuse: ["Patient is A&Ox4 with capacity","Patient is over 18","Patient understands risks of refusal","Risks including worsening condition and death explained","Patient advised to call 911 if symptoms return or worsen","Patient advised to follow up with PCP","Refusal form signed with witness","Patient refused signature","Family/caregiver present and in agreement","Patient left in care of family","Patient left in care of police","Online medical control contacted"]

const sections = [
 {tag:"", pre:true, title:"Patient", html:`
  <div class="row">
   <div><label class="f">Age</label><input type="number" id="age" min="0" inputmode="numeric"></div>
   <div><label class="f">Unit</label><select id="ageu"><option>year</option><option>month</option><option>day</option></select></div>
   <div><label class="f">Sex (optional)</label><select id="sex"><option value="">Not stated</option><option>male</option><option>female</option></select></div>
  </div>
  <div class="row" style="margin-top:10px">
   <div><label class="f">Chief complaint</label>${sel("cc",D.cc)}</div>
   <div><label class="f">Patient found</label>${sel("found",D.found,true)}</div>
  </div>
  <div class="other" id="cc_o"><input type="text" id="cc_t" placeholder="Describe chief complaint"></div>`},
 {tag:"S", title:"Subjective", html:`
  <fieldset><legend>History source</legend>${chips("src",D.src)}</fieldset>
  <fieldset><legend>OPQRST</legend>
   <div class="row">
    <div><label class="f">Onset</label>${sel("onset",D.onset,true)}</div>
    <div><label class="f">Duration</label>${sel("dur",D.dur,true)}</div>
   </div>
   <div class="row" style="margin-top:8px">
    <div><label class="f">Provocation / palliation</label>${sel("prov",D.prov,true)}</div>
    <div><label class="f">Quality</label>${sel("qual",D.qual,true)}</div>
   </div>
   <div class="row" style="margin-top:8px">
    <div><label class="f">Radiation</label>${sel("rad",D.rad,true)}</div>
    <div><label class="f">Severity (0 to 10)</label><input type="number" id="sev" min="0" max="10" inputmode="numeric"></div>
   </div>
  </fieldset>
  <fieldset><legend>Associated symptoms (tap once for admits, twice for denies, again to clear)</legend>${tri("sx",D.sx)}
   <div class="row" style="margin-top:8px"><div><label class="f">Other symptoms admitted</label><input type="text" id="sx_a"></div><div><label class="f">Other symptoms denied</label><input type="text" id="sx_d"></div></div></fieldset>
  <fieldset><legend>Events leading up to the call</legend>${chips("events",D.events)}</fieldset>
  <fieldset><legend>Treatment prior to arrival</legend>${chips("self",D.self)}</fieldset>
  <fieldset><legend>Baseline and living situation</legend>${chips("base",D.base)}</fieldset>
  <fieldset><legend>Past medical history</legend>${chips("pmh",D.pmh)}<input type="text" id="pmh_t" placeholder="Other history" style="margin-top:8px"></fieldset>
  <fieldset><legend>Medications</legend>${chips("meds",D.meds)}</fieldset>
  <fieldset><legend>Allergies</legend><input type="text" id="allg" placeholder="Leave blank for NKDA"></fieldset>
  <fieldset><legend>Last oral intake</legend><input type="text" id="loi" placeholder="e.g. lunch approx 1200"></fieldset>
  <fieldset><legend>Last known well (stroke, seizure, AMS)</legend><input type="text" id="lkw" placeholder="e.g. 0730, witnessed by spouse"></fieldset>
  <fieldset><legend>Additional subjective (your words)</legend><textarea id="s_t" placeholder="Anything the patient or others reported that isn't covered above"></textarea></fieldset>`},
 {tag:"O", title:"Objective", html:`
  <fieldset><legend>General appearance</legend>${chips("gen",D.gen)}</fieldset>
  <fieldset><legend>Level of consciousness</legend>${chips("loc",D.loc)}</fieldset>
  <fieldset><legend>Airway</legend>${chips("air",D.air)}</fieldset>
  <fieldset><legend>Breathing</legend>${chips("breath",D.breath)}</fieldset>
  <fieldset><legend>Lung sounds</legend>${chips("lung",D.lung)}</fieldset>
  <fieldset><legend>Skin / circulation</legend>${chips("skin",D.skin)}</fieldset>
  <fieldset><legend>HEENT / neck</legend>${chips("heent",D.heent)}</fieldset>
  <fieldset><legend>Chest</legend>${chips("chest",D.chest)}</fieldset>
  <fieldset><legend>Abdomen / pelvis</legend>${chips("abd",D.abd)}</fieldset>
  <fieldset><legend>Extremities</legend>${chips("ext",D.ext)}</fieldset>
  <fieldset><legend>Neuro</legend>${chips("neuro",D.neuro)}</fieldset>
  <fieldset><legend>Vital signs</legend>
   <div class="row">
    <div><label class="f">BP</label><input type="text" id="bp" placeholder="120/80"></div>
    <div><label class="f">HR</label><input type="text" id="hr" inputmode="numeric"></div>
    <div><label class="f">RR</label><input type="text" id="rr" inputmode="numeric"></div>
    <div><label class="f">SpO2 %</label><input type="text" id="spo2" inputmode="numeric"></div>
   </div>
   <div class="row" style="margin-top:8px">
    <div><label class="f">EtCO2</label><input type="text" id="etco2" inputmode="numeric"></div>
    <div><label class="f">BGL</label><input type="text" id="bgl" inputmode="numeric"></div>
    <div><label class="f">Temp</label><input type="text" id="temp"></div>
    <div><label class="f">GCS</label><input type="text" id="gcs" placeholder="15 (E4 V5 M6)"></div>
   </div>
   <p class="hint">Serial vitals can go in the plan section below.</p>
  </fieldset>
  <fieldset><legend>ECG / 12 lead</legend>${chips("ecg",D.ecg)}</fieldset>
  <fieldset><legend>Additional objective findings (your words)</legend><textarea id="o_t"></textarea></fieldset>`},
 {tag:"A", title:"Assessment", html:`
  <div class="row">
   <div><label class="f">Primary impression</label>${sel("imp1",D.impress)}</div>
   <div><label class="f">Secondary impression</label>${sel("imp2",D.impress,true)}</div>
  </div>
  <div class="other" id="imp1_o"><input type="text" id="imp1_t" placeholder="Describe impression"></div>
  <div style="margin-top:10px"><label class="f">RI protocol followed</label>${sel("proto",D.proto,true)}</div>
  <div class="other" id="proto_o"><input type="text" id="proto_t" placeholder="Protocol name"></div>
  <fieldset style="margin-top:12px"><legend>Clinical reasoning (your words)</legend><textarea id="a_t" placeholder="Why this impression, what was ruled in or out, differentials considered"></textarea></fieldset>`},
 {tag:"P", title:"Plan", html:`
  <fieldset><legend>Interventions</legend>${chips("tx",D.tx)}</fieldset>
  <fieldset><legend>Vascular access</legend><div class="rows acc" id="accrows"></div><button type="button" class="add" id="addacc">Add IV / IO</button></fieldset>
  <fieldset><legend>Medications given</legend><div class="rows" id="medrows"></div><button type="button" class="add" id="addmed">Add medication</button>
   <textarea id="med_t" placeholder="Anything else about medications (contraindications, withheld and why, med not carried)" style="margin-top:8px"></textarea></fieldset>
  <fieldset><legend>Response to treatment</legend>${chips("resp",D.resp)}</fieldset>
  <fieldset><legend>Serial vitals / reassessment</legend><textarea id="reass" placeholder="e.g. Reassessed at 1425: BP 128/76, HR 88, RR 18, SpO2 98% on 2 lpm"></textarea></fieldset>
  <fieldset><legend>Transport</legend>
   <div class="row">
    <div><label class="f">Destination</label>${sel("dest",D.dest,true)}</div>
    <div><label class="f">Mode</label>${sel("mode",D.mode,true)}</div>
    <div><label class="f">Position</label>${sel("pos",D.pos,true)}</div>
   </div>
   <div class="other" id="dest_o"><input type="text" id="dest_t" placeholder="Destination"></div>
   <div class="row" style="margin-top:8px">
    <div><label class="f">Care transferred to</label>${sel("toc",D.toc,true)}</div>
    <div><label class="f">Report given by</label><input type="text" id="tocby" placeholder="e.g. radio and verbal at bedside"></div>
   </div>
  </fieldset>
  <fieldset><legend>Refusal (only if applicable)</legend>${chips("refuse",D.refuse)}</fieldset>
  <fieldset><legend>Additional plan (your words)</legend><textarea id="p_t"></textarea></fieldset>`}
];

function sel(id,opts,blank){return `<select id="${id}">${blank?'<option value="">Not documented</option>':''}${opts.map(o=>`<option>${o}</option>`).join("")}</select>`}
function tri(id,opts){return `<div class="chips tri" data-tri="${id}">${opts.map(o=>`<label data-state="" data-v="${o}">${o}</label>`).join("")}</div>`}
function chips(id,opts){return `<div class="chips" data-group="${id}">${opts.map(o=>`<label><input type="checkbox" value="${o}">${o}</label>`).join("")}<label><input type="checkbox" value="__other">other</label></div><div class="other" id="${id}_o"><input type="text" id="${id}_t" placeholder="Add your own wording"></div>`}

document.getElementById("app").innerHTML = sections.map(s=>`<section class="block"><div class="tag${s.pre?' pre':''}">${s.tag||'&#9679;'}</div><div class="body"><h2>${s.title}</h2>${s.html}</div></section>`).join("");

document.querySelectorAll(".tri label").forEach(l=>l.addEventListener("click",()=>{const s=l.dataset.state;l.dataset.state=s===""?"admits":s==="admits"?"denies":"";}));
const triv=id=>{const a=[],d=[];document.querySelectorAll(`[data-tri="${id}"] label`).forEach(l=>{if(l.dataset.state==="admits")a.push(l.dataset.v);else if(l.dataset.state==="denies")d.push(l.dataset.v);});const oa=v(id+"_a"),od=v(id+"_d");if(oa)a.push(oa);if(od)d.push(od);return {a,d};};
// show "other" fields
document.querySelectorAll(".chips").forEach(g=>g.addEventListener("change",()=>{
  const o=g.querySelector('input[value="__other"]');document.getElementById(g.dataset.group+"_o").classList.toggle("show",o.checked);}));
["cc","imp1","proto","dest"].forEach(id=>{const s=document.getElementById(id);const f=()=>document.getElementById(id+"_o").classList.toggle("show",s.value==="Other");s.addEventListener("change",f);f();});

// ---------- medication and access rows ----------
const DRUGS=["Aspirin","Nitroglycerin","Albuterol","Ipratropium","Epinephrine 1:1,000 IM","Epinephrine 1:10,000 IV","Epinephrine push dose","Naloxone","Dextrose 10%","Dextrose 50%","Glucagon","Ondansetron","Fentanyl","Morphine","Ketamine","Midazolam","Lorazepam","Diphenhydramine","Methylprednisolone","Amiodarone","Lidocaine","Adenosine","Diltiazem","Atropine","Magnesium sulfate","Sodium bicarbonate","Calcium chloride","Nitrous oxide","Acetaminophen","Ibuprofen","Ketorolac","Normal saline bolus","Lactated Ringer's bolus","Tranexamic acid","Oral glucose","Activated charcoal","Other"];
const UNITS=["mg","mcg","g","mL","units","L","puffs","mg/kg","mcg/kg"];
const ROUTES=["PO","SL","IV","IO","IM","IN","Neb","SQ","Buccal","Inhaled","Topical","Rectal"];
const GAUGE=["14g","16g","18g","20g","22g","24g","IO 15mm","IO 25mm","IO 45mm"];
const SITES=["left AC","right AC","left forearm","right forearm","left hand","right hand","left EJ","right EJ","left wrist","right wrist","left upper arm","right upper arm","left proximal tibia","right proximal tibia","left proximal humerus","right proximal humerus","left distal tibia","right distal tibia","pre existing access"];
const opts=(a,blank)=>(blank?`<option value="">${blank}</option>`:"")+a.map(o=>`<option>${o}</option>`).join("");
function addMed(){const r=document.createElement("div");r.className="r";r.innerHTML=`<select class="drug">${opts(DRUGS,"Medication")}</select><input type="text" class="dose" placeholder="Dose" inputmode="decimal"><select class="unit">${opts(UNITS)}</select><select class="route">${opts(ROUTES,"Route")}</select><input type="text" class="time" placeholder="Time" inputmode="numeric"><button type="button" title="Remove">&times;</button>`;
  r.querySelector("button").onclick=()=>r.remove();
  r.querySelector(".drug").onchange=e=>{if(e.target.value==="Other"){const n=prompt("Medication name");if(n){const o=document.createElement("option");o.textContent=n;o.selected=true;e.target.appendChild(o);}else e.target.value="";}};
  document.getElementById("medrows").appendChild(r);}
function addAcc(){const r=document.createElement("div");r.className="r";r.innerHTML=`<select class="type"><option>IV</option><option>IO</option><option>Saline lock</option></select><select class="gauge">${opts(GAUGE,"Gauge")}</select><select class="site">${opts(SITES,"Site")}</select><input type="text" class="att" placeholder="Attempts" inputmode="numeric"><select class="ok"><option>patent</option><option>unsuccessful</option><option>infiltrated</option><option>flushed and locked</option></select><input type="text" class="time" placeholder="Time" inputmode="numeric"><button type="button" title="Remove">&times;</button>`;
  r.querySelector("button").onclick=()=>r.remove();document.getElementById("accrows").appendChild(r);}
document.getElementById("addmed").onclick=addMed;
document.getElementById("addacc").onclick=addAcc;
const medRows=()=>[...document.querySelectorAll("#medrows .r")].map(r=>({drug:r.querySelector(".drug").value,dose:r.querySelector(".dose").value.trim(),unit:r.querySelector(".unit").value,route:r.querySelector(".route").value,time:r.querySelector(".time").value.trim()})).filter(m=>m.drug);
const accRows=()=>[...document.querySelectorAll("#accrows .r")].map(r=>({type:r.querySelector(".type").value,gauge:r.querySelector(".gauge").value,site:r.querySelector(".site").value,att:r.querySelector(".att").value.trim(),ok:r.querySelector(".ok").value,time:r.querySelector(".time").value.trim()}));

// ---------- helpers ----------
const v=id=>(document.getElementById(id)?.value||"").trim();
const picked=id=>{const a=[...document.querySelectorAll(`[data-group="${id}"] input:checked`)].map(i=>i.value).filter(x=>x!=="__other");const t=v(id+"_t");if(t)a.push(t);return a;};
const selv=id=>{const x=v(id);return x==="Other"?v(id+"_t"):x;};
const list=a=>a.length<2?a.join(""):a.length===2?a.join(" and "):a.slice(0,-1).join(", ")+", and "+a[a.length-1];
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const end=s=>/[.!?]$/.test(s)?s:s+".";

// ---------- narrative ----------
function build(){
  const age=v("age"), ageu=v("ageu"), sex=v("sex"), cc=selv("cc")||"unspecified complaint";
  const ageTxt=age?`${age} ${ageu}${age==="1"?"":"s"} old`:"";
  const pt=[ageTxt,sex].filter(Boolean).join(" ");
  const S=[],O=[],A=[],P=[];

  // Subjective
  let intro=`Patient is a ${pt?pt+" ":""}${sex?"":"patient "}complaining of ${cc.toLowerCase()}`;
  const found=v("found"); if(found) intro+=`, found ${found}`;
  S.push(end(intro));
  const src=picked("src"); if(src.length) S.push(`History obtained from ${list(src)}.`);
  const op=[]; const on=v("onset"),du=v("dur"),pr=v("prov"),qu=v("qual"),ra=v("rad"),se=v("sev");
  if(on) op.push(`onset was ${on}`);
  if(du) op.push(`duration approximately ${du}`);
  if(qu) op.push(`described as ${qu}`);
  if(ra) op.push(ra);
  if(pr) op.push(pr);
  if(se!=="") op.push(`rated ${se}/10`);
  if(op.length) S.push(cap(op.join(", "))+".");
  const ev=picked("events"); if(ev.length) S.push(cap(list(ev))+".");
  const sx=triv("sx");
  if(sx.a.length) S.push(`Patient reports associated ${list(sx.a)}.`);
  if(sx.d.length) S.push(`Patient denies ${list(sx.d)}.`);
  const sf=picked("self"); if(sf.length) S.push(`Prior to EMS arrival, patient ${list(sf)}.`);
  const bs=picked("base"); if(bs.length) S.push(`Patient is ${list(bs)}.`);
  const pmh=picked("pmh"); const pmht=v("pmh_t"); if(pmh.length||pmht) S.push(`PMH includes ${list([...pmh,pmht].filter(Boolean))}.`);
  const meds=picked("meds"); if(meds.length) S.push(cap(list(meds))+".");
  S.push(`Allergies: ${v("allg")||"NKDA"}.`);
  const loi=v("loi"); if(loi) S.push(`Last oral intake ${loi}.`);
  const lkw=v("lkw"); if(lkw) S.push(`Last known well ${lkw}.`);
  const st=v("s_t"); if(st) S.push(end(st));

  // Objective
  const gen=picked("gen"); if(gen.length) O.push(`General: ${list(gen)}.`);
  const loc=picked("loc"); if(loc.length) O.push(`LOC: ${list(loc)}.`);
  const air=picked("air"); if(air.length) O.push(`Airway ${list(air)}.`);
  const br=picked("breath"); const lu=picked("lung");
  if(br.length||lu.length) O.push(`Breathing ${br.length?list(br):""}${br.length&&lu.length?", ":""}${lu.length?"lung sounds "+list(lu):""}.`);
  const sk=picked("skin"); if(sk.length) O.push(`Skin ${list(sk)}.`);
  const he=picked("heent"); if(he.length) O.push(`HEENT/neck: ${list(he)}.`);
  const ch=picked("chest"); if(ch.length) O.push(`Chest: ${list(ch)}.`);
  const ab=picked("abd"); if(ab.length) O.push(`Abdomen/pelvis: ${list(ab)}.`);
  const ex=picked("ext"); if(ex.length) O.push(`Extremities: ${list(ex)}.`);
  const ne=picked("neuro"); if(ne.length) O.push(`Neuro: ${list(ne)}.`);
  const vit=[];[["BP","bp"],["HR","hr"],["RR","rr"],["SpO2","spo2","%"],["EtCO2","etco2"],["BGL","bgl"],["Temp","temp"],["GCS","gcs"]].forEach(([l,id,u])=>{const x=v(id);if(x)vit.push(`${l} ${x}${u||""}`)});
  if(vit.length) O.push(`Initial vitals: ${vit.join(", ")}.`);
  const ecg=picked("ecg"); if(ecg.length) O.push(`ECG: ${list(ecg)}.`);
  const ot=v("o_t"); if(ot) O.push(end(ot));

  // Assessment
  const i1=selv("imp1"), i2=v("imp2");
  if(i1) A.push(`Field impression: ${i1}${i2?"; secondary impression "+i2:""}.`);
  const pro=selv("proto"); if(pro) A.push(`Care provided per Rhode Island EMS ${pro} protocol.`);
  const at=v("a_t"); if(at) A.push(end(at));

  // Plan
  const tx=picked("tx"); if(tx.length) P.push(`Interventions: ${list(tx)}.`);
  const acc=accRows();
  if(acc.length) P.push(acc.map(a=>{let t=`${a.type} access ${a.ok==="unsuccessful"?"attempted":"established"}`;const d=[a.gauge,a.site].filter(Boolean).join(" ");if(d)t+=`, ${d}`;if(a.att)t+=`, ${a.att} attempt${a.att==="1"?"":"s"}`;if(a.ok!=="unsuccessful")t+=`, ${a.ok}`;if(a.time)t+=` at ${a.time}`;return t+".";}).join(" "));
  const mr=medRows();
  if(mr.length) P.push("Medications: "+mr.map(m=>[m.drug,m.dose?m.dose+" "+m.unit:"",m.route,m.time?"at "+m.time:""].filter(Boolean).join(" ")).join("; ")+".");
  const mt=v("med_t"); if(mt) P.push(end(mt));
  const rs=picked("resp"); if(rs.length) P.push(`Patient ${list(rs)} following treatment.`);
  const re=v("reass"); if(re) P.push(end(re));
  const dest=selv("dest"),mode=v("mode"),pos=v("pos");
  if(dest||mode||pos){let t="Patient transported";if(pos)t+=` in ${pos}`;if(dest)t+=` to ${dest}`;if(mode)t+=` ${mode}`;P.push(t+".");}
  const toc=v("toc"),tocby=v("tocby");
  if(toc||tocby) P.push(`Care transferred to ${toc||"receiving staff"}${tocby?" with report given "+tocby:" with full verbal report"}, no change in patient condition noted at time of transfer.`);
  const rf=picked("refuse"); if(rf.length) P.push(`Refusal: ${list(rf)}.`);
  const pt2=v("p_t"); if(pt2) P.push(end(pt2));

  const blk=(h,a)=>`${h}:\n${a.length?a.join(" "):"No findings documented."}`;
  return [blk("S",S),blk("O",O),blk("A",A),blk("P",P)].join("\n\n");
}

// ---------- completeness check ----------
function check(){
  const f=[];
  const cc=(selv("cc")||"").toLowerCase(), imp=((selv("imp1")||"")+" "+v("imp2")).toLowerCase();
  const ctx=cc+" "+imp;
  const has=(id,re)=>picked(id).some(x=>re.test(x));
  const any=(...res)=>res.some(re=>re.test(ctx));
  const tx=picked("tx"), meds=medRows(), acc=accRows(), SX=triv("sx"), sxAll=[...SX.a,...SX.d];

  // universal
  if(!v("bp")||!v("hr")||!v("rr")||!v("spo2")) f.push("Full set of initial vitals (BP, HR, RR, SpO2)");
  if(!picked("loc").length) f.push("Level of consciousness / orientation");
  if(!picked("skin").length) f.push("Skin findings");
  if(!selv("imp1")) f.push("Primary field impression");
  if(!selv("proto")) f.push("RI protocol followed");
  if(!picked("src").length) f.push("Who provided the history");
  if(!sxAll.length) f.push("Associated symptoms admitted or denied");
  if(!picked("events").length&&!v("onset")&&!v("s_t")) f.push("Events leading up to the call");
  if(!picked("base").length&&any(/altered|weakness|fall|stroke|dementia/)) f.push("Baseline mental and functional status");
  const refusal=picked("refuse").length>0;
  if(!refusal&&!selv("dest")) f.push("Transport destination (or refusal documentation)");
  if(!refusal&&selv("dest")&&!v("toc")) f.push("Who care was transferred to");
  if(refusal&&!has("refuse",/capacity/)) f.push("Refusal: statement of decision making capacity");
  if(refusal&&!has("refuse",/risks/i)) f.push("Refusal: risks explained");
  if(tx.length&&!picked("resp").length) f.push("Response to treatment");
  if(has("tx",/administered|nebulizer|bolus|Epinephrine/)&&!meds.length) f.push("Medication rows with dose, route, and time (interventions list a medication)");
  if(has("tx",/IV access|IO access/)&&!acc.length) f.push("Access row with gauge and site (interventions list IV/IO)");
  if(meds.some(m=>!m.dose||!m.route)) f.push("Every medication needs a dose and route");
  if(meds.some(m=>!m.time)) f.push("Medication times");
  if(meds.some(m=>/IV|IO/.test(m.route))&&!acc.length) f.push("IV/IO medication given but no access documented");
  if(acc.some(a=>!a.gauge||!a.site)) f.push("Every access row needs a gauge and site");
  if(meds.some(m=>/Fentanyl|Morphine|Ketamine|Midazolam|Lorazepam|Nitrous/.test(m.drug))&&!v("reass")) f.push("Reassessment vitals after sedating or analgesic medication");
  if(meds.some(m=>/Nitroglycerin/.test(m.drug))){ if(!v("bp")) f.push("BP before nitroglycerin"); if(!v("reass")) f.push("Repeat BP after nitroglycerin"); }

  // chest pain / cardiac
  if(any(/chest pain|cardiac|coronary|stemi|dysrhythmia|syncope|palpit/)){
    if(!picked("ecg").length||has("ecg",/not obtained/)) f.push("12 lead ECG interpretation");
    if(!has("tx",/12 lead/)) f.push("12 lead ECG listed as an intervention");
    if(!has("tx",/Cardiac monitor/)) f.push("Cardiac monitor");
    if(!has("tx",/IV access|IO access/)&&!acc.length) f.push("IV access");
  }
  if(any(/chest pain|coronary|stemi/)){
    if(!v("sev")) f.push("Pain severity 0 to 10");
    if(!v("qual")) f.push("Pain quality");
    if(!v("onset")) f.push("Onset");
    if(!meds.some(m=>/Aspirin/.test(m.drug))&&!/aspirin|asa/i.test(v("med_t"))) f.push("Aspirin given, or reason it was withheld");
    if(!sxAll.some(x=>/shortness of breath|nausea|diaphoresis/.test(x))&&!picked("gen").some(x=>/diaphoretic/.test(x))) f.push("Associated symptoms (SOB, nausea, diaphoresis) present or denied");
    if(!has("heent",/JVD/)&&!picked("lung").length) f.push("Lung sounds");
    if(/stemi/.test(ctx)&&!has("tx",/STEMI alert/)) f.push("STEMI alert notification");
  }
  // respiratory
  if(any(/shortness of breath|respiratory|copd|asthma|chf|pneumonia|pulmonary/)){
    if(!picked("lung").length) f.push("Lung sounds");
    if(!picked("breath").length) f.push("Work of breathing / ability to speak");
    if(!v("etco2")) f.push("EtCO2");
    if(!has("tx",/Oxygen|CPAP|BVM|nebulizer/)&&!/oxygen|o2|room air/i.test(v("p_t")+v("o_t"))) f.push("Oxygen, CPAP, or nebulizer given, or note that patient stayed on room air");
    if(!v("reass")) f.push("Repeat SpO2 and RR after treatment");
  }
  // stroke
  if(any(/stroke|tia|cva/)){
    if(!v("lkw")) f.push("Last known well time");
    if(!has("neuro",/BE-FAST|facial droop|arm drift|speech|aphasia/)&&!has("heent",/facial droop/)) f.push("Stroke screen findings (BE-FAST)");
    if(!v("bgl")) f.push("Blood glucose (stroke mimic)");
    if(!has("tx",/Stroke alert/)&&!/mimic|no acute|negative/.test(ctx+picked("neuro").join(" ").toLowerCase())) f.push("Stroke alert notification");
    if(!picked("meds").some(x=>/anticoagulant/.test(x))&&!/anticoag|eliquis|xarelto|warfarin|coumadin/i.test(v("s_t"))) f.push("Anticoagulant use documented");
  }
  // seizure
  if(any(/seizure/)){
    if(!v("bgl")) f.push("Blood glucose");
    if(!v("dur")) f.push("Seizure duration");
    if(!has("neuro",/seizure activity/)&&!/witnessed|unwitnessed/i.test(v("s_t"))) f.push("Seizure witnessed or unwitnessed, and description");
    if(!has("loc",/postictal|A&O|GCS|confused/)) f.push("Postictal status / mental status trend");
    if(!picked("pmh").some(x=>/seizure/.test(x))&&!/seizure|epilep/i.test(v("pmh_t"))) f.push("History of seizure disorder, yes or no");
    if(!v("reass")) f.push("Reassessment of mental status");
  }
  // AMS / syncope / weakness
  if(any(/altered|weakness|syncope|behavioral|psychiatric/)){
    if(!v("bgl")) f.push("Blood glucose");
    if(!v("gcs")) f.push("GCS");
    if(!has("heent",/pupils/)) f.push("Pupils");
    if(!picked("neuro").length) f.push("Neuro exam / stroke screen");
  }
  // diabetic
  if(any(/diabetic|hypoglyc|hyperglyc/)){
    if(!v("bgl")) f.push("Initial blood glucose");
    if(!/bgl|glucose|cbg/i.test(v("reass"))) f.push("Repeat blood glucose after treatment");
    if(!v("loi")) f.push("Last oral intake");
    if(!picked("meds").some(x=>/insulin|hypoglycemic/.test(x))) f.push("Insulin or oral hypoglycemic use");
  }
  // overdose
  if(any(/overdose|poison|intoxication|opioid/)){
    if(!has("heent",/pupils/)) f.push("Pupils");
    if(!v("rr")) f.push("Respiratory rate");
    if(!v("gcs")) f.push("GCS");
    if(!/opioid|alcohol/.test(ctx)&&!/substance|ingest|took|pills|drug/i.test(v("s_t"))) f.push("Substance, amount, and time of ingestion");
    if(/opioid/.test(ctx)&&!meds.some(m=>/Naloxone/.test(m.drug))&&!/naloxone|narcan/i.test(v("med_t")+v("p_t"))) f.push("Naloxone given, or reason it was not needed");
    if(!v("etco2")) f.push("EtCO2");
  }
  // allergic
  if(any(/allergic|anaphylaxis/)){
    if(!picked("air").length) f.push("Airway status");
    if(!picked("lung").length) f.push("Lung sounds");
    if(!has("skin",/flushed|warm|pale|cyanotic|dry/)&&!/hives|urticaria|rash|swelling/i.test(v("o_t"))) f.push("Skin findings (hives, swelling)");
    if(!v("allg")) f.push("Suspected allergen / exposure");
    if(/anaphylaxis/.test(ctx)&&!meds.some(m=>/Epinephrine/.test(m.drug))) f.push("Epinephrine IM for anaphylaxis, or reason withheld");
  }
  // trauma
  if(any(/fall|motor vehicle|assault|trauma|injury|fracture|head injury|extremity|back pain/)){
    if(!v("onset")&&!/mechanism|fell|struck|hit|mvc|feet|stairs/i.test(v("s_t"))) f.push("Mechanism of injury");
    if(!has("ext",/CSM/)) f.push("CSM distal to injury or x4");
    if(!has("tx",/Spinal motion restriction/)&&!/smr|spinal|c-collar|cleared|nexus/i.test(v("a_t")+v("p_t"))) f.push("Spinal motion restriction applied, or why it was not indicated");
    if(!v("gcs")) f.push("GCS");
    if(!sxAll.some(x=>/loss of consciousness|neck pain/.test(x))&&!/loc|consciousness/i.test(v("s_t"))) f.push("Loss of consciousness and neck pain, present or denied");
    if(!picked("meds").some(x=>/anticoagulant/.test(x))&&/fall|head/.test(ctx)) f.push("Anticoagulant use (fall or head injury)");
    if(!v("sev")) f.push("Pain severity 0 to 10");
    if(/fall/.test(ctx)&&!has("neuro",/gait/)&&!refusal) f.push("Ambulatory status / gait");
  }
  // abdominal / GI
  if(any(/abdominal|gi bleed|nausea|vomiting/)){
    if(!picked("abd").length) f.push("Abdominal exam");
    if(!v("loi")) f.push("Last oral intake");
    if(!sxAll.some(x=>/vomiting|diarrhea|fever|urinary|dysuria|melena|hematemesis/.test(x))) f.push("Vomiting, diarrhea, fever, urinary symptoms, present or denied");
    if(!v("sev")) f.push("Pain severity 0 to 10");
  }
  // cardiac arrest
  if(any(/cardiac arrest/)){
    if(!has("ecg",/asystole|PEA|fibrillation|tachycardia|rhythm/)) f.push("Initial rhythm");
    if(!has("tx",/CPR/)) f.push("CPR");
    if(!v("etco2")) f.push("EtCO2");
    if(!picked("air").length) f.push("Airway management");
    if(!/witnessed|unwitnessed|bystander|down time|last seen/i.test(v("s_t"))) f.push("Witnessed or unwitnessed, bystander CPR, estimated down time");
    if(!/rosc|pronounc|termination|tor/i.test(v("p_t")+v("reass"))) f.push("ROSC or termination of resuscitation with times");
  }
  // sepsis
  if(any(/sepsis|fever/)){
    if(!v("temp")) f.push("Temperature");
    if(!v("etco2")) f.push("EtCO2");
    if(!/infection|uti|pneumonia|wound|source/i.test(v("s_t")+v("a_t"))) f.push("Suspected source of infection");
  }
  return f;
}
function showFlags(){
  const f=check(), box=document.getElementById("flags"), ul=document.getElementById("flaglist");
  box.style.display="block";
  if(!f.length){box.classList.add("ok");ul.innerHTML="<li>Nothing obvious missing for this complaint.</li>";return;}
  box.classList.remove("ok");ul.innerHTML=f.map(x=>`<li>${x}</li>`).join("");
}
document.getElementById("gen").onclick=()=>{
  if(!v("age")){alert("Patient age is required.");document.getElementById("age").focus();return;}
  showFlags();
  document.getElementById("narr").textContent=build();
  document.getElementById("out").style.display="block";document.getElementById("flags").scrollIntoView({behavior:"smooth"});
};
document.getElementById("copy").onclick=async()=>{
  const t=document.getElementById("narr").textContent||build();
  try{await navigator.clipboard.writeText(t);}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();}
  const s=document.getElementById("toast");s.style.display="block";setTimeout(()=>s.style.display="none",1400);
};
document.getElementById("clear").onclick=()=>{
  if(!confirm("Clear everything?"))return;
  document.querySelectorAll("input,select,textarea").forEach(e=>{if(e.type==="checkbox")e.checked=false;else if(e.tagName==="SELECT")e.selectedIndex=0;else e.value="";});
  document.querySelectorAll(".other").forEach(e=>e.classList.remove("show"));
  document.querySelectorAll(".tri label").forEach(l=>l.dataset.state="");
  document.querySelectorAll("#medrows .r,#accrows .r").forEach(e=>e.remove());
  document.getElementById("flags").style.display="none";
  document.getElementById("out").style.display="none";window.scrollTo({top:0});
};
</script>
